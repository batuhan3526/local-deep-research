name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Real errors only (syntax errors, undefined names, broken comparisons). Style is left to review: the code base
    # uses a dense style that a full ruff rule set would fight.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.15.14"
      - run: ruff check --select E9,F63,F7,F82 --output-format=github .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    env:
      PYTHONUTF8: "0"            # test the real default encoding (cp1252 on Windows): every file access must say utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The CPU wheel of torch is ~200 MB instead of the ~2.5 GB CUDA build pip picks by default on Linux/Windows.
      # sentence-transformers then reuses it. macOS wheels are CPU-only already.
      - name: Install torch (CPU)
        if: runner.os != 'macOS'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install the package
        # networkx: citation_graph.py imports it, pyproject.toml does not list it yet
        run: pip install -e ".[dev,reports]" networkx

      # Some suites load small sentence-transformers models (MiniLM embedders and cross-encoders, ~0.5 GB in all).
      # They are downloaded once, cached, and the tests then run with the Hugging Face hub offline.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1-${{ runner.os }}
      - name: Download the models (no-op when cached)
        run: >-
          python -c "from local_deep_research import config;
          from sentence_transformers import SentenceTransformer, CrossEncoder;
          s = config.Settings();
          [SentenceTransformer(m, device='cpu') for m in (s.embed_model, s.multilingual_embed_model)];
          [CrossEncoder(m, device='cpu') for m in (s.cross_encoder, s.multilingual_cross_encoder)]"

      - name: Run the tests
        env:
          HF_HUB_OFFLINE: "1"
        run: python -m pytest -q tests
