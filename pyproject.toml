[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-deep-research"
version = "0.1.0"
description = "Local, topic-agnostic deep research: harvest, verify and cite evidence with any OpenAI-compatible LLM server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.24",
  "trafilatura>=1.8",
  "lxml>=5",
  "pypdf>=4",
  "rapidfuzz>=3",
  "networkx>=3",
  "sentence-transformers>=3",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
# PDF / XLSX / PPTX / charts. WeasyPrint needs Pango (see README); without it the report is written as HTML.
reports = ["markdown>=3.5", "weasyprint>=61", "pandas>=2", "openpyxl>=3.1", "python-pptx>=0.6", "matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
ldr = "local_deep_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
